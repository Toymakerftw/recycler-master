<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Navbar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mdi/font@6.5.95/css/materialdesignicons.min.css"
    />
  </head>
  <body class="bg-gray-100">
    <!-- Navbar -->
    <nav class="bg-white shadow-md">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
          <!-- Left Section: Logo -->
          <div class="flex-shrink-0">
            <div class="flex items-center">
              <i class="mdi mdi-trash-can text-2xl text-blue-600"></i>
              <span class="ml-2 text-xl font-bold text-gray-800"> CBIN </span>
            </div>
          </div>

          <!-- Center Section: Navigation Links -->
          <div class="hidden md:flex space-x-8">
            <a
              href="/"
              class="text-gray-700 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium"
            >
              Dashboard
            </a>
            <a
              href="/agent"
              class="text-gray-700 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium"
            >
              Agents
            </a>
            <a
              href="#"
              class="text-gray-700 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium"
            >
              Reports
            </a>
            <a
              href="#"
              class="text-gray-700 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium"
            >
              Analytics
            </a>
          </div>

          <!-- Right Section: Profile Dropdown -->
          <div class="flex items-center space-x-4">
            <button
              class="text-gray-700 hover:text-blue-600 md:hidden"
              id="mobile-menu-button"
            >
              <i class="mdi mdi-menu text-2xl"></i>
            </button>
            <div class="relative">
              <button
                class="flex items-center space-x-2 focus:outline-none"
                id="profile-button"
              >
                <img
                  src="https://via.placeholder.com/32"
                  alt="Profile"
                  class="w-8 h-8 rounded-full"
                />
                <span class="hidden md:block text-gray-700 font-medium">
                  John Doe
                </span>
                <i class="mdi mdi-chevron-down text-gray-500"></i>
              </button>
              <!-- Dropdown -->
              <div
                class="absolute right-0 mt-2 w-48 bg-white shadow-md rounded-md hidden"
                id="profile-menu"
              >
                <a
                  href="#"
                  class="block px-4 py-2 text-gray-700 hover:bg-gray-100"
                >
                  Profile
                </a>
                <a
                  href="#"
                  class="block px-4 py-2 text-gray-700 hover:bg-gray-100"
                >
                  Settings
                </a>
                <a
                  href="#"
                  class="block px-4 py-2 text-gray-700 hover:bg-gray-100"
                >
                  Logout
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Mobile Menu -->
      <div class="md:hidden hidden" id="mobile-menu">
        <div class="px-2 pt-2 pb-3 space-y-1">
          <a
            href="#"
            class="block text-gray-700 hover:text-blue-600 px-3 py-2 rounded-md text-base font-medium"
          >
            Dashboard
          </a>
          <a
            href="#"
            class="block text-gray-700 hover:text-blue-600 px-3 py-2 rounded-md text-base font-medium"
          >
            Agents
          </a>
          <a
            href="#"
            class="block text-gray-700 hover:text-blue-600 px-3 py-2 rounded-md text-base font-medium"
          >
            Reports
          </a>
          <a
            href="#"
            class="block text-gray-700 hover:text-blue-600 px-3 py-2 rounded-md text-base font-medium"
          >
            Analytics
          </a>
        </div>
      </div>
    </nav>

    <script>
      // Toggle Mobile Menu
      const mobileMenuButton = document.getElementById("mobile-menu-button");
      const mobileMenu = document.getElementById("mobile-menu");
      const profileButton = document.getElementById("profile-button");
      const profileMenu = document.getElementById("profile-menu");

      mobileMenuButton.addEventListener("click", () => {
        mobileMenu.classList.toggle("hidden");
      });

      // Toggle Profile Dropdown
      profileButton.addEventListener("click", () => {
        profileMenu.classList.toggle("hidden");
      });

      // Close dropdowns when clicking outside
      document.addEventListener("click", (e) => {
        if (
          !profileButton.contains(e.target) &&
          !profileMenu.contains(e.target)
        ) {
          profileMenu.classList.add("hidden");
        }
      });
    </script>
  </body>
</html>
